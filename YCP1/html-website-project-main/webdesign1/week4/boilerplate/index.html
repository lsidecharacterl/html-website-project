<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Typology System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f4f4;
            color: #111;
        }

        .page-title {
            text-align: center;
            padding: 30px 20px 10px;
            font-size: 2rem;
        }

        .page-subtitle {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 30px;
            padding: 0 20px;
            line-height: 1.5;
        }

        .grid {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            padding: 12px;
        }

        .grid-item {
            flex: 0 0 calc(33.333% - 12px);
        }

        .card {
            display: flex;
            border: 2px solid #000;
            background: #fff;
            height: 100%;
        }

        .content-box {
            padding: 12px;
        }

        .content-box h3 {
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .content-box p {
            line-height: 1.5;
            margin-bottom: 10px;
            font-size: 0.95rem;
        }

        .content-box a {
            color: #000;
            font-weight: bold;
            text-decoration: none;
            border-bottom: 1px solid #000;
        }

        /* REUSABLE MEDIA BOX */
        .media-box {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
            overflow: hidden;
            background: #ddd;
        }

        .media-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card.card--left-right {
            flex-direction: row;
            min-height: 260px;
        }

        .card.card--left-right .media-box {
            flex: 0 0 45%;
            padding-bottom: 0;
            min-height: 260px;
        }

        .card.card--left-right .media-image {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card.card--left-right .content-box {
            flex: 1;
        }

        .card.card--top-bot {
            flex-direction: column;
        }

        .card.card--top-bot .media-box {
            padding-bottom: 56.25%;
        }

        .card.card--layered {
            position: relative;
            overflow: hidden;
            display: block;
            min-height: 320px;
        }

        .card.card--layered .media-box {
            padding-bottom: 75%;
        }

        .card.card--layered .content-box {
            position: absolute;
            left: 12px;
            bottom: 12px;
            max-width: 75%;
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid #000;
        }

        @media (max-width: 1024px) {
            .grid-item {
                flex-basis: calc(50% - 12px);
            }
        }

        @media (max-width: 768px) {
            .grid-item {
                flex-basis: 100%;
            }

            .card.card--left-right {
                flex-direction: column;
            }

            .card.card--left-right .media-box {
                flex: none;
                width: 100%;
                min-height: 0;
                padding-bottom: 56.25%;
            }
        }

        @media (max-width: 480px) {
            .grid {
                padding: 0;
                gap: 0;
            }

            .grid-item {
                flex-basis: 100%;
            }

            .card {
                border-left: none;
                border-right: none;
            }
        }
    </style>
</head>

<body>
