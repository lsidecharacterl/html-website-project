<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jazz Poster</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="poster">
        <div class="grain"></div>

        <div class="title-bar">Rhythm • Space • Sound</div>

        <section class="music-strip yellow-strip">
            <div class="staff-lines">
                <span></span><span></span><span></span><span></span><span></span>
            </div>

            <div class="red-note-group">
                <div class="note n1"></div>
                <div class="note n2"></div>
                <div class="note n3"></div>
                <div class="beam beam1"></div>
            </div>

            <div class="single-note">
                <div class="note"></div>
            </div>

            <div class="red-block"></div>
        </section>

        <section class="music-strip cream-strip">
            <div class="staff-lines">
                <span></span><span></span><span></span><span></span><span></span>
            </div>

            <div class="single-note yellow">
                <div class="note"></div>
            </div>

            <div class="big-red-block"></div>
        </section>

        <section class="banner-zone">
            <div class="staff-lines light banner-lines">
                <span></span><span></span><span></span><span></span>
            </div>

            <div class="banner-front">
                Make <span class="yellow-word">Noise</span>
            </div>
            <div class="banner-back">Visible</div>
            <div class="banner-tail"></div>
        </section>

        <section class="circle-strip">
            <div class="staff-lines light">
                <span></span><span></span><span></span><span></span><span></span>
            </div>
            <div class="circle left"></div>
            <div class="circle right"></div>
        </section>

        <section class="blank-strip">
            <div class="bottom-lines">
                <span></span><span></span>
            </div>
        </section>

        <div class="footer-bar">Jazz Is Disruption</div>
    </div>
</body>

</html>
